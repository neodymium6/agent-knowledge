[package]
name = "agent-knowledge-repository"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
agent-knowledge-core = { path = "../core" }
agent-knowledge-queue = { path = "../queue" }
agent-knowledge-release = { path = "../release" }
lindera = { version = "=5.0.1", default-features = false, features = ["embed-ipadic"] }
lindera-analysis = "=5.0.1"
lindera-tantivy = "=5.0.1"
unicode-normalization = "0.1.25"
serde.workspace = true
serde_json.workspace = true
serde-saphyr.workspace = true
sha2.workspace = true
tantivy.workspace = true
time.workspace = true
ulid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.30.1", features = ["fs", "process", "signal", "user"] }

[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
]
all-features = true

[advisories]
unmaintained = "workspace"
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "MIT",
  "ISC",
  "Unicode-3.0",
  "Zlib",
]
confidence-threshold = 0.93

[licenses.private]
ignore = false

[[licenses.exceptions]]
crate = "webpki-roots@1.0.9"
allow = ["CDLA-Permissive-2.0"] # CA data used by Lindera's dictionary build downloader.

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
skip = [
  { crate = "bitflags@1.3.2", reason = "Lindera's kanaria dependency still uses bitflags 1 while the workspace uses 2" },
  { crate = "hashbrown@0.16.1", reason = "Tantivy's lru uses hashbrown 0.16 while Lindera's dictionary and YAML dependencies use 0.17" },
  { crate = "getrandom@0.2.17", reason = "ring uses getrandom 0.2 for TLS while the workspace uses newer lines" },
  { crate = "base64@0.23.1", reason = "rmcp uses base64 0.23 while its HTTP dependencies still use 0.22" },
  { crate = "getrandom@0.3.4", reason = "serde-saphyr still uses ahash's older getrandom line while ulid uses 0.4" },
  { crate = "syn@2.0.119", reason = "rmcp dependencies currently require both syn 2 and syn 3" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

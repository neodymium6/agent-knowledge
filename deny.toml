[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "aarch64-unknown-linux-gnu",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
]
all-features = true

[advisories]
unmaintained = "workspace"
ignore = []

[licenses]
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "MIT",
  "Unicode-3.0",
]
confidence-threshold = 0.93

[licenses.private]
ignore = false

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
skip = [
  { crate = "base64@0.23.1", reason = "rmcp uses base64 0.23 while its HTTP dependencies still use 0.22" },
  { crate = "getrandom@0.3.4", reason = "serde-saphyr still uses ahash's older getrandom line while ulid uses 0.4" },
  { crate = "syn@2.0.119", reason = "rmcp dependencies currently require both syn 2 and syn 3" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []

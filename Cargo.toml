[workspace]
members = [
    ".",
    "crates/client",
    "crates/core",
    "crates/gateway",
    "crates/protocol",
    "crates/queue",
  "crates/release",
  "crates/repository",
  "crates/worker",
]
resolver = "3"

[workspace.package]
version = "0.1.8"
edition = "2024"
rust-version = "1.97"
license = "Apache-2.0"
repository = "https://github.com/neodymium6/agent-knowledge"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde-saphyr = { version = "0.0.29", default-features = false, features = ["deserialize", "serialize"] }
sha2 = "0.11.0"
tantivy = { version = "0.26.1", default-features = false }
tar = { version = "0.4.46", default-features = false }
time = { version = "0.3.54", features = ["formatting", "parsing", "serde"] }
ulid = { version = "3.0.0", features = ["serde"] }

[package]
name = "agent-knowledge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Centralized file-based knowledge management for coding agents"
readme = "README.md"
publish = false
default-run = "agent-knowledge"

[[bin]]
name = "agent-knowledge-ssh-shell"
path = "src/bin/agent_knowledge_ssh_shell.rs"

[lints]
workspace = true

[dependencies]
agent-knowledge-client = { path = "crates/client" }
agent-knowledge-core = { path = "crates/core" }
agent-knowledge-gateway = { path = "crates/gateway" }
agent-knowledge-protocol = { path = "crates/protocol" }
agent-knowledge-queue = { path = "crates/queue" }
agent-knowledge-release = { path = "crates/release" }
agent-knowledge-repository = { path = "crates/repository" }
agent-knowledge-worker = { path = "crates/worker" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
signal-hook = { version = "0.4.4", default-features = false }
tar.workspace = true
time.workspace = true
ulid.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
nix = { version = "0.30.1", features = ["dir", "fs", "poll", "process", "signal", "user"] }
xattr = { version = "1.6.1", default-features = false }

[workspace]
members = [
  ".",
  "crates/core",
  "crates/queue",
  "crates/release",
  "crates/repository",
  "crates/worker",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
expect_used = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

[workspace.dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde-saphyr = { version = "0.0.29", default-features = false, features = ["deserialize", "serialize"] }
sha2 = "0.11.0"
time = { version = "0.3.54", features = ["formatting", "parsing", "serde"] }
ulid = { version = "3.0.0", features = ["serde"] }

[package]
name = "agent-knowledge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
agent-knowledge-queue = { path = "crates/queue" }
serde.workspace = true
serde_json.workspace = true

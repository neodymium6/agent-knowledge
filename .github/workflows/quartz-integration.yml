name: Quartz Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quartz-integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  real-quartz:
    name: Real Quartz build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check out Quartz
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jackyzha0/quartz
          ref: 74b3fc9efd0caafea3dbcd846ddf1f06855b6d2a
          path: .quartz-integration
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.16.0
          cache: npm
          cache-dependency-path: .quartz-integration/package-lock.json

      - name: Install locked Quartz dependencies
        run: npm ci --ignore-scripts --prefix .quartz-integration

      - name: Exercise the Worker Quartz contract
        run: bash deploy/quartz-e2e/check.sh "$GITHUB_WORKSPACE/.quartz-integration"

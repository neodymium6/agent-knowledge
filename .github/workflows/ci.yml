name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code:
    name: Code checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
        with:
          determinate: false

      - name: Run repository checks
        run: nix develop --command just ci

      - name: Exercise OpenSSH and distinct service identities
        run: |
          openssh_gateway_package=$(nix build .#openssh-gateway-package --no-link --print-out-paths)
          openssh_binary=$(nix develop --command which sshd)
          openssh_bin=${openssh_binary%/sshd}
          sudo deploy/systemd/check-privilege-boundary.sh \
            "$openssh_gateway_package/bin/agent-knowledge" \
            "$openssh_gateway_package/bin/agent-knowledge-ssh-shell" \
            "$PWD/deploy/systemd/agent-knowledge.conf.tmpfiles" \
            "$openssh_bin"

  packages:
    name: Package (${{ matrix.system }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - system: x86_64-linux
            runner: ubuntu-24.04
          - system: aarch64-linux
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
        with:
          determinate: false

      - name: Validate package, systemd integration, and container image
        run: nix develop --command just check-package

apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-knowledge
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: agent-knowledge-headless
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: agent-knowledge
  ports:
    - name: ssh
      port: 2222
      protocol: TCP
      targetPort: ssh
---
apiVersion: v1
kind: Service
metadata:
  name: agent-knowledge-ssh
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agent-knowledge
  ports:
    - name: ssh
      appProtocol: ssh
      port: 2222
      protocol: TCP
      targetPort: ssh
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-knowledge-ssh
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-knowledge
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 2222
          protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agent-knowledge
spec:
  replicas: 1
  serviceName: agent-knowledge-headless
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-knowledge
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-knowledge
    spec:
      automountServiceAccountToken: false
      serviceAccountName: agent-knowledge
      terminationGracePeriodSeconds: 660
      nodeSelector:
        agent-knowledge.io/pod-pids-limit: "512"
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        supplementalGroupsPolicy: Merge
      initContainers:
        - name: prepare-ssh-directory
          image: example.invalid/agent-knowledge-storage-bootstrap:0.1.5
          imagePullPolicy: IfNotPresent
          command:
            - /bin/install
          args:
            - --directory
            - --mode=0755
            - /staged
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
            - name: ssh-credentials
              mountPath: /staged
        - name: stage-ssh-host-key
          image: example.invalid/agent-knowledge-storage-bootstrap:0.1.5
          imagePullPolicy: IfNotPresent
          command:
            - /bin/install
          args:
            - --mode=0400
            - /projected/ssh_host_ed25519_key
            - /staged/ssh_host_ed25519_key
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
            - name: ssh-credentials-source
              mountPath: /projected
              readOnly: true
            - name: ssh-credentials
              mountPath: /staged
        - name: stage-ssh-authorized-keys
          image: example.invalid/agent-knowledge-storage-bootstrap:0.1.5
          imagePullPolicy: IfNotPresent
          command:
            - /bin/install
          args:
            - --mode=0444
            - /projected/authorized_keys
            - /staged/authorized_keys
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
            - name: ssh-credentials-source
              mountPath: /projected
              readOnly: true
            - name: ssh-credentials
              mountPath: /staged
        - name: storage-bootstrap
          image: example.invalid/agent-knowledge-storage-bootstrap:0.1.5
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/agent-knowledge/worker.yaml
            - --runtime-directory
            - /run/agent-knowledge
            - --worker-owner
            - "10003"
            - --worker-group
            - "10003"
            - --queue-owner
            - "10002"
            - --queue-group
            - "10002"
            - --gateway-owner
            - "10001"
            - --gateway-group
            - "10001"
            - --ingress-group
            - "10004"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - FSETID
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
            - name: configuration
              mountPath: /etc/agent-knowledge
              readOnly: true
            - name: knowledge
              mountPath: /var/lib/agent-knowledge
            - name: runtime
              mountPath: /run/agent-knowledge
      containers:
        - name: worker
          image: example.invalid/agent-knowledge-worker:0.1.5
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/agent-knowledge/worker.yaml
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 10003
            runAsNonRoot: true
            runAsUser: 10003
          volumeMounts:
            - name: configuration
              mountPath: /etc/agent-knowledge
              readOnly: true
            - name: knowledge
              mountPath: /var/lib/agent-knowledge
            - name: quartz
              mountPath: /opt/agent-knowledge-quartz
              readOnly: true
        - name: queue-ingress
          image: example.invalid/agent-knowledge-queue-ingress:0.1.5
          imagePullPolicy: IfNotPresent
          args:
            - --queue-root
            - /var/lib/agent-knowledge/queue
            - --socket-path
            - /run/agent-knowledge/queue-ingress.sock
            - --maximum-connections
            - "64"
            - --connection-timeout-seconds
            - "3900"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 10002
            runAsNonRoot: true
            runAsUser: 10002
          volumeMounts:
            - name: knowledge
              mountPath: /var/lib/agent-knowledge
            - name: runtime
              mountPath: /run/agent-knowledge
        - name: openssh-gateway
          image: example.invalid/agent-knowledge-openssh-gateway:0.1.5
          imagePullPolicy: IfNotPresent
          ports:
            - name: ssh
              containerPort: 2222
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - SETGID
                - SETUID
                - SYS_CHROOT
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
            - name: configuration
              mountPath: /etc/agent-knowledge
              readOnly: true
            - name: ssh-credentials
              mountPath: /etc/agent-knowledge-ssh
              readOnly: true
            - name: knowledge
              mountPath: /var/lib/agent-knowledge
              readOnly: true
            - name: runtime
              mountPath: /run/agent-knowledge
            - name: sshd-runtime
              mountPath: /run/sshd
      volumes:
        - name: configuration
          configMap:
            name: agent-knowledge-config
            defaultMode: 0444
        - name: runtime
          emptyDir:
            sizeLimit: 64Mi
        - name: sshd-runtime
          emptyDir:
            sizeLimit: 16Mi
        - name: ssh-credentials
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: ssh-credentials-source
          secret:
            secretName: agent-knowledge-ssh-v1
            defaultMode: 0400
            items:
              - key: ssh_host_ed25519_key
                path: ssh_host_ed25519_key
                mode: 0400
              - key: authorized_keys
                path: authorized_keys
                mode: 0444
        - name: quartz
          persistentVolumeClaim:
            claimName: agent-knowledge-quartz-v1
            readOnly: true
  volumeClaimTemplates:
    - metadata:
        name: knowledge
      spec:
        accessModes:
          - ReadWriteOncePod
        resources:
          requests:
            storage: 20Gi
        volumeMode: Filesystem

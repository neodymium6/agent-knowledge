apiVersion: v1
kind: ServiceAccount
metadata:
  name: agent-knowledge
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: agent-knowledge-config
data:
  worker.yaml: |
    schema_version: 1
    storage:
      queue_root: /var/lib/agent-knowledge/queue
      repository_root: /var/lib/agent-knowledge/repository
      content_root: /var/lib/agent-knowledge/content
      work_root: /var/lib/agent-knowledge/work
      release_root: /var/lib/agent-knowledge/releases
    repository:
      official_branch: main
      author_name: Fictional Knowledge Worker
      author_email: worker@example.invalid
    quartz:
      program: /opt/agent-knowledge-quartz/bin/build-site
      integration_root: /opt/agent-knowledge-quartz
      timeout_seconds: 300
    batch:
      debounce_seconds: 30
      maximum_age_seconds: 300
      maximum_scan_entries: 1024
      maximum_requests: 100
      maximum_recovery_requests: 10000
    retention:
      retained_releases: 10
      maximum_scan_entries: 10000
      maximum_removals: 10
  gateway.yaml: |
    schema_version: 4
    identity:
      gateway_uid: 10001
    storage:
      queue_socket: /run/agent-knowledge/queue-ingress.sock
      git_directory: /var/lib/agent-knowledge/repository
      content_root: /var/lib/agent-knowledge/content
    repository:
      official_branch: main
    reads:
      maximum_results: 100
      maximum_query_characters: 512
      maximum_index_entries: 100000
      maximum_index_markdown_bytes: 536870912
      maximum_search_documents: 10000
      maximum_search_markdown_bytes: 536870912
      operation_timeout_seconds: 30
      maximum_response_bytes: 268435456
      search_metadata:
        node: true
        agent: true
        session: true
        request_id: true
    transport:
      submit_timeout_seconds: 300
  sshd_config: |
    ListenAddress 0.0.0.0
    ListenAddress ::
    AddressFamily any
    HostKey /etc/agent-knowledge/ssh/ssh_host_ed25519_key
    PidFile /run/sshd/sshd.pid
    AuthorizedKeysFile /etc/agent-knowledge/ssh/authorized_keys
    AuthorizedKeysCommand none
    TrustedUserCAKeys none
    AuthenticationMethods publickey
    PubkeyAuthentication yes
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    HostbasedAuthentication no
    UsePAM no
    PermitRootLogin no
    AllowUsers agent-knowledge-gateway
    AllowGroups agent-knowledge-gateway
    PermitTTY no
    DisableForwarding yes
    AllowAgentForwarding no
    AllowTcpForwarding no
    GatewayPorts no
    X11Forwarding no
    PermitTunnel no
    PermitUserEnvironment no
    PermitUserRC no
    MaxAuthTries 3
    MaxSessions 1
    MaxStartups 10:30:30
    LoginGraceTime 10
    ClientAliveInterval 15
    ClientAliveCountMax 1
    StrictModes yes
    PrintMotd no
    PrintLastLog no
    UseDNS no
    LogLevel VERBOSE
---
apiVersion: v1
kind: Service
metadata:
  name: agent-knowledge-headless
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: agent-knowledge
  ports:
    - name: ssh
      port: 2222
      protocol: TCP
      targetPort: ssh
---
apiVersion: v1
kind: Service
metadata:
  name: agent-knowledge-ssh
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agent-knowledge
  ports:
    - name: ssh
      appProtocol: ssh
      port: 2222
      protocol: TCP
      targetPort: ssh
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-knowledge-ssh
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-knowledge
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 2222
          protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: agent-knowledge
spec:
  replicas: 1
  serviceName: agent-knowledge-headless
  selector:
    matchLabels:
      app.kubernetes.io/name: agent-knowledge
  updateStrategy:
    type: RollingUpdate
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-knowledge
    spec:
      automountServiceAccountToken: false
      serviceAccountName: agent-knowledge
      terminationGracePeriodSeconds: 660
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        supplementalGroupsPolicy: Merge
      initContainers:
        - name: storage-bootstrap
          image: example.invalid/agent-knowledge-storage-bootstrap:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/agent-knowledge/worker.yaml
            - --runtime-directory
            - /run/agent-knowledge
            - --worker-owner
            - "10003"
            - --worker-group
            - "10003"
            - --queue-owner
            - "10002"
            - --queue-group
            - "10002"
            - --gateway-owner
            - "10001"
            - --gateway-group
            - "10001"
            - --ingress-group
            - "10004"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - CHOWN
                - DAC_OVERRIDE
                - FOWNER
                - FSETID
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
            - name: configuration
              mountPath: /etc/agent-knowledge
              readOnly: true
            - name: knowledge
              mountPath: /var/lib/agent-knowledge
            - name: runtime
              mountPath: /run/agent-knowledge
      containers:
        - name: worker
          image: example.invalid/agent-knowledge-worker:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - --config
            - /etc/agent-knowledge/worker.yaml
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "2"
              memory: 2Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 10003
            runAsNonRoot: true
            runAsUser: 10003
          volumeMounts:
            - name: configuration
              mountPath: /etc/agent-knowledge
              readOnly: true
            - name: knowledge
              mountPath: /var/lib/agent-knowledge
            - name: quartz
              mountPath: /opt/agent-knowledge-quartz
              readOnly: true
        - name: queue-ingress
          image: example.invalid/agent-knowledge-queue-ingress:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            - --queue-root
            - /var/lib/agent-knowledge/queue
            - --socket-path
            - /run/agent-knowledge/queue-ingress.sock
            - --maximum-connections
            - "64"
            - --connection-timeout-seconds
            - "3900"
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 10002
            runAsNonRoot: true
            runAsUser: 10002
          volumeMounts:
            - name: knowledge
              mountPath: /var/lib/agent-knowledge
            - name: runtime
              mountPath: /run/agent-knowledge
        - name: openssh-gateway
          image: example.invalid/agent-knowledge-openssh-gateway:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: ssh
              containerPort: 2222
              protocol: TCP
          startupProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 2
            failureThreshold: 30
          readinessProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: ssh
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - SETGID
                - SETUID
                - SYS_CHROOT
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
            - name: configuration
              mountPath: /etc/agent-knowledge
              readOnly: true
            - name: ssh-credentials
              mountPath: /etc/agent-knowledge/ssh
              readOnly: true
            - name: knowledge
              mountPath: /var/lib/agent-knowledge
              readOnly: true
            - name: runtime
              mountPath: /run/agent-knowledge
            - name: sshd-runtime
              mountPath: /run/sshd
      volumes:
        - name: configuration
          configMap:
            name: agent-knowledge-config
            defaultMode: 0444
        - name: runtime
          emptyDir:
            sizeLimit: 64Mi
        - name: sshd-runtime
          emptyDir:
            sizeLimit: 16Mi
        - name: ssh-credentials
          secret:
            secretName: agent-knowledge-ssh
            defaultMode: 0400
            items:
              - key: ssh_host_ed25519_key
                path: ssh_host_ed25519_key
                mode: 0400
              - key: authorized_keys
                path: authorized_keys
                mode: 0444
        - name: quartz
          persistentVolumeClaim:
            claimName: agent-knowledge-quartz
            readOnly: true
  volumeClaimTemplates:
    - metadata:
        name: knowledge
      spec:
        accessModes:
          - ReadWriteOncePod
        resources:
          requests:
            storage: 20Gi
        volumeMode: Filesystem

apiVersion: v1
kind: Namespace
metadata:
  name: agent-knowledge-e2e
---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: csi-hostpath-sc
provisioner: hostpath.csi.k8s.io
reclaimPolicy: Delete
volumeBindingMode: Immediate
allowVolumeExpansion: true
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-knowledge-quartz-v1
  namespace: agent-knowledge-e2e
spec:
  accessModes:
    - ReadWriteOncePod
  resources:
    requests:
      storage: 64Mi
  storageClassName: csi-hostpath-sc
  volumeMode: Filesystem
---
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-agent-knowledge-quartz-v1
  namespace: agent-knowledge-e2e
spec:
  activeDeadlineSeconds: 120
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: agent-knowledge-quartz-seed
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: agent-knowledge-kubernetes-e2e-quartz:0.1.7
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -eu
            - -c
          args:
            - |
              mkdir -p /quartz/bin
              cp /bin/busybox /quartz/bin/busybox
              cp /fixture/build-site /quartz/bin/build-site
              chmod 0555 /quartz /quartz/bin /quartz/bin/busybox /quartz/bin/build-site
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 0
            runAsUser: 0
          volumeMounts:
            - name: quartz
              mountPath: /quartz
      volumes:
        - name: quartz
          persistentVolumeClaim:
            claimName: agent-knowledge-quartz-v1
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-quartz-seed-ingress
  namespace: agent-knowledge-e2e
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: agent-knowledge-quartz-seed
  policyTypes:
    - Ingress

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agent-knowledge-e2e

resources:
  - ../kubernetes

images:
  - name: example.invalid/agent-knowledge-worker
    newName: agent-knowledge-worker
    newTag: 0.1.5
  - name: example.invalid/agent-knowledge-queue-ingress
    newName: agent-knowledge-queue-ingress
    newTag: 0.1.5
  - name: example.invalid/agent-knowledge-openssh-gateway
    newName: agent-knowledge-openssh-gateway
    newTag: 0.1.5
  - name: example.invalid/agent-knowledge-storage-bootstrap
    newName: agent-knowledge-storage-bootstrap
    newTag: 0.1.5

patches:
  - path: statefulset-patch.yaml
  - path: worker-config-patch.yaml
